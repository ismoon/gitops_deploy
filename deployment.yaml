apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-nginx
  name: frontend-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-nginx
  template:
    metadata:
      labels:
        app: frontend-nginx
    spec:
      containers:
      # ECR에 저장된 이미지로 지정한다.
      - image: 579573111875.dkr.ecr.ap-northeast-2.amazonaws.com/k8s-cluster-repo:v2.0
        name: frontend-nginx


























